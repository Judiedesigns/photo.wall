<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hang Your Favorite Photos | Private Local Photo Wall</title>
<meta name="description" content="Create a private, offline photo wall of favorite moments. Add photos and captions as polaroids saved locally in your browser.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#4d7f43">
<meta name="application-name" content="Hang Your Favorite Photos">
<meta name="apple-mobile-web-app-title" content="Photo Wall">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Hang Your Favorite Photos">
<meta property="og:title" content="Hang Your Favorite Photos">
<meta property="og:description" content="A quiet, private photo wall for saving favorite moments as local polaroids.">
<meta property="og:image" content="bg-2.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Hang Your Favorite Photos">
<meta name="twitter:description" content="A quiet, private photo wall for saving favorite moments as local polaroids.">
<meta name="twitter:image" content="bg-2.jpg">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="site.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink: #253528;
  --muted: #6d7a6f;
  --paper: #fffaf1;
  --paper-deep: #f7efe0;
  --leaf: #4d7f43;
  --leaf-dark: #254a31;
  --gold: #d6a748;
  --clay: #9f8a64;
  --shadow: 0 18px 60px rgba(20, 39, 28, 0.28);
}

body {
  min-height: 100vh;
  overflow-x: hidden;
  font-family: Lora, Georgia, serif;
  color: var(--ink);
  background: #9fc8de;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

.skip-link {
  position: absolute;
  top: -100%;
  left: 1rem;
  z-index: 1000;
  padding: 0.65rem 1rem;
  border-radius: 0 0 10px 10px;
  background: var(--paper);
  color: var(--ink);
  text-decoration: none;
}

.skip-link:focus { top: 0; }

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
}

.scene {
  position: fixed;
  inset: 0;
  z-index: 0;
  background-image: url("bg-2.jpg");
  background-size: cover;
  background-position: center;
}

.scene::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(180deg, rgba(14, 34, 21, 0.22), rgba(255, 255, 255, 0.1) 38%, rgba(17, 47, 31, 0.38)),
    radial-gradient(circle at 50% 18%, rgba(255, 255, 255, 0.28), transparent 38%);
}

.page {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  padding-bottom: 5.5rem;
}

.is-loading .page,
.is-loading .quick-add,
.is-loading .made-by {
  opacity: 0;
  pointer-events: none;
}

.header {
  width: min(980px, calc(100% - 2rem));
  margin: 0 auto;
  padding: 3rem 0 1.5rem;
  text-align: center;
}

.header-title {
  font-family: "Caveat", cursive;
  font-size: clamp(3.1rem, 8.4vw, 5.7rem);
  font-weight: 700;
  color: #fff;
  line-height: 1;
  text-shadow:
    0 2px 0 rgba(0, 0, 0, 0.35),
    0 4px 24px rgba(0, 0, 0, 0.45),
    0 1px 0 rgba(0, 0, 0, 0.2);
  letter-spacing: 0;
}

.header-sub {
  max-width: 38rem;
  margin: 1rem auto 0;
  font-size: clamp(0.95rem, 2vw, 1.08rem);
  line-height: 1.55;
  color: rgba(255, 253, 244, 0.9);
  text-shadow: 0 2px 12px rgba(14, 40, 24, 0.45);
}

.quick-add {
  width: min(980px, calc(100% - 2rem));
  margin: 0 auto 0.75rem;
  display: grid;
  grid-template-columns: minmax(160px, 0.75fr) minmax(260px, 1.45fr) minmax(170px, auto);
  gap: 0.8rem;
  align-items: center;
  transition: opacity 0.2s ease;
}

.quick-input {
  width: 100%;
  height: 54px;
  border: 1px solid rgba(255, 255, 255, 0.38);
  border-radius: 999px;
  padding: 0 1.55rem;
  background: rgba(59, 87, 110, 0.44);
  color: #f7fbff;
  outline: 0;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 1rem;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2), 0 10px 22px rgba(15, 34, 49, 0.12);
  backdrop-filter: blur(10px);
  transition: border-color 0.16s ease, background 0.16s ease, box-shadow 0.16s ease;
}

.quick-input::placeholder {
  color: rgba(245, 249, 252, 0.74);
}

.quick-input:focus {
  border-color: rgba(255, 255, 255, 0.68);
  background: rgba(59, 87, 110, 0.58);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.24), 0 0 0 3px rgba(255, 255, 255, 0.12), 0 10px 22px rgba(15, 34, 49, 0.14);
}

.quick-add-btn {
  height: 54px;
  border: 1px solid rgba(255, 255, 255, 0.82);
  border-radius: 999px;
  padding: 0 1.65rem;
  background: rgba(255, 255, 255, 0.94);
  color: #17364b;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 1rem;
  font-weight: 800;
  box-shadow: 0 16px 32px rgba(15, 34, 49, 0.2);
  transition: transform 0.14s ease, background 0.14s ease, box-shadow 0.14s ease;
}

.quick-add-btn:hover {
  transform: translateY(-2px);
  background: #fff;
  box-shadow: 0 18px 34px rgba(15, 34, 49, 0.25);
}

.quick-add-btn:active {
  transform: translateY(0) scale(0.98);
}

.board {
  position: relative;
  width: 100%;
  min-height: 460px;
  padding: 2rem clamp(1rem, 4vw, 3rem) 6rem;
}

.polaroid-wrap {
  position: absolute;
  width: 184px;
  cursor: grab;
  touch-action: none;
  transform: rotate(var(--rot));
  transform-origin: center 20px;
  animation: popIn 0.42s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  transition: transform 0.2s ease, filter 0.2s ease, opacity 0.2s ease;
}

.polaroid-wrap:hover,
.polaroid-wrap:focus-within {
  z-index: 300 !important;
  transform: rotate(0deg) scale(1.12) translateY(-12px);
  filter: drop-shadow(0 18px 28px rgba(20, 39, 28, 0.28));
}

.polaroid-wrap.dragging {
  z-index: 500 !important;
  cursor: grabbing;
  animation: none;
  transform: rotate(0deg) scale(1.04);
  filter: drop-shadow(0 20px 32px rgba(20, 39, 28, 0.32));
}

.polaroid-wrap.deleting {
  opacity: 0;
  transform: rotate(0deg) scale(0.72);
}

@keyframes popIn {
  from { opacity: 0; transform: rotate(var(--rot)) scale(0.55); }
  to { opacity: 1; }
}

.polaroid {
  position: relative;
  width: 184px;
  padding: 10px 10px 42px;
  border: 1px solid rgba(216, 213, 205, 0.82); /* 4. subtle paper edge */
  border-radius: 3px;
  background: #fbfaf5; /* 1. calmer paper tone */
  box-shadow: 0 9px 24px rgba(20, 39, 28, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.86); /* 2. softer lift */
}

.polaroid-img {
  width: 164px;
  height: 144px;
  display: grid;
  place-items: center;
  overflow: hidden;
  background: #dce8d3;
  color: var(--leaf);
  font-size: 2.4rem;
}

.polaroid-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.polaroid-caption {
  margin-top: 0.75rem;
  text-align: center;
  font-size: 1rem;
  line-height: 1.35;
  color: #2d2922;
  word-break: break-word;
}

.polaroid-author {
  margin-top: 0.35rem;
  text-align: center;
  font-size: 0.75rem;
  color: #887d6c;
}

.delete-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 4;
  width: 30px;
  height: 30px;
  border: 1px solid rgba(255, 255, 255, 0.42);
  border-radius: 50%;
  background: rgba(105, 103, 96, 0.9); /* 3. quieter delete color */
  color: #fffdf8;
  font-size: 1.25rem;
  line-height: 1;
  opacity: 0;
  pointer-events: none;
  box-shadow: 0 4px 10px rgba(20, 39, 28, 0.18);
  transition: opacity 0.18s ease, transform 0.18s ease, background 0.18s ease;
}

.polaroid-wrap:hover .delete-btn,
.polaroid-wrap:focus-within .delete-btn {
  opacity: 1;
  pointer-events: auto;
}

.delete-btn:hover {
  transform: scale(1.08);
  background: rgba(83, 81, 76, 0.96);
}

.made-by {
  position: fixed;
  right: clamp(1rem, 4vw, 2rem);
  bottom: clamp(1rem, 4vw, 2rem);
  z-index: 120;
  color: rgba(247, 251, 255, 0.72);
  font-family: Arial, Helvetica, sans-serif;
  font-size: 0.78rem;
  text-decoration: none;
  text-shadow: 0 2px 10px rgba(15, 34, 49, 0.35);
  transition: color 0.14s ease, opacity 0.14s ease;
}

.made-by:hover,
.made-by:focus-visible {
  color: #fff;
}

.viewer-backdrop,
.loading-overlay {
  position: fixed;
  inset: 0;
  z-index: 300;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(16, 36, 24, 0.54);
  backdrop-filter: blur(12px);
}

.viewer-backdrop {
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}

.viewer-backdrop.open {
  opacity: 1;
  pointer-events: auto;
  background: rgba(92, 92, 88, 0.5);
  backdrop-filter: none;
}

.modal {
  position: relative;
  width: min(560px, calc(100% - 2rem));
  min-height: 0;
  padding: 2rem 2.35rem 1.9rem;
  border: 2px solid rgba(255, 255, 255, 0.7);
  border-radius: 0;
  background: rgba(252, 251, 247, 0.97);
  color: #666460;
  font-family: Lora, Georgia, serif;
  box-shadow: 0 18px 46px rgba(0, 0, 0, 0.16);
  transform: translateY(18px) scale(0.96);
  transition: transform 0.22s ease;
}

.modal::before {
  content: none;
}

.modal-close {
  position: absolute;
  top: 0.9rem;
  right: 0.9rem;
  z-index: 2;
  width: 36px;
  height: 36px;
  border: 1px solid rgba(170, 168, 164, 0.28);
  border-radius: 50%;
  background: rgba(252, 251, 247, 0.9);
  color: #aaa8a4;
  font-family: Georgia, serif;
  font-size: 1.9rem;
  line-height: 1;
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
  transition: color 0.14s ease, background 0.14s ease, border-color 0.14s ease;
}

.modal-close:hover {
  color: #6f6d69;
  border-color: rgba(111, 109, 105, 0.3);
  background: #fcfbf7;
}

.viewer-backdrop.open .modal {
  transform: translateY(0) scale(1);
}

.modal-title {
  font-family: Lora, Georgia, serif;
  font-size: clamp(1.35rem, 2.2vw, 1.65rem);
  font-weight: 700;
  line-height: 1.18;
  color: #696763;
  text-align: left;
  letter-spacing: 0;
  text-shadow: none;
}

.modal-sub {
  margin: 0.7rem 0 1.55rem;
  max-width: 28rem;
  color: #666460;
  text-align: left;
  line-height: 1.38;
  font-size: clamp(1rem, 1.7vw, 1.18rem);
  font-weight: 700;
}

.viewer-modal {
  width: min(520px, calc(100% - 2rem));
  padding: 3.4rem 2rem 2rem;
}

.viewer-photo {
  width: 100%;
  max-height: 58vh;
  margin-bottom: 1.2rem;
  overflow: hidden;
  border: 1px solid #d8d5cd;
  background: rgba(255, 255, 252, 0.7);
}

.viewer-photo img {
  width: 100%;
  max-height: 58vh;
  object-fit: contain;
  display: block;
  background: #f5f3ed;
}

.viewer-photo.is-empty {
  display: grid;
  min-height: 220px;
  place-items: center;
  color: #8d8b84;
  font-size: 3rem;
}

.viewer-caption {
  margin-top: 0.85rem;
  color: #595753;
  font-size: 1.05rem;
  line-height: 1.55;
  word-break: break-word;
}

.viewer-author {
  margin-top: 0.8rem;
  color: #8d8b84;
  font-size: 0.9rem;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 6rem;
  z-index: 500;
  transform: translateX(-50%) translateY(60px);
  max-width: min(28rem, calc(100% - 2rem));
  padding: 0.8rem 1.1rem;
  border-radius: 999px;
  background: rgba(28, 55, 35, 0.86);
  color: #fffaf1;
  opacity: 0;
  transition: transform 0.22s ease, opacity 0.22s ease;
  box-shadow: 0 10px 28px rgba(20, 39, 28, 0.24);
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.loading-overlay {
  z-index: 800;
  flex-direction: column;
  gap: 0.7rem;
  background: rgba(20, 39, 28, 0.18);
  backdrop-filter: blur(5px);
  transition: opacity 0.35s ease;
}

.loading-overlay.hidden {
  opacity: 0;
  pointer-events: none;
}

.loading-title {
  font-family: "Caveat", cursive;
  font-size: clamp(2.1rem, 6vw, 3.6rem);
  font-weight: 700;
  line-height: 1;
  color: #fffaf1;
  letter-spacing: 0;
  text-shadow: 0 2px 16px rgba(14, 40, 24, 0.38);
}

.loading-dots {
  display: flex;
  gap: 0.45rem;
}

.loading-dots span {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: rgba(255, 250, 241, 0.82);
  animation: bounce 1.2s ease-in-out infinite;
}

.loading-dots span:nth-child(2) { animation-delay: 0.16s; }
.loading-dots span:nth-child(3) { animation-delay: 0.32s; }

@keyframes bounce {
  0%, 100% { transform: translateY(0); opacity: 0.55; }
  50% { transform: translateY(-8px); opacity: 1; }
}

@media (max-width: 680px) {
  .header {
    padding-top: 2.25rem;
  }

  .quick-add {
    width: min(430px, calc(100% - 1.25rem));
    grid-template-columns: 1fr;
    gap: 0.6rem;
    margin-bottom: 0.4rem;
  }

  .quick-input,
  .quick-add-btn {
    height: 50px;
    font-size: 0.98rem;
  }

  .quick-input {
    padding: 0 1.3rem;
  }

  .modal {
    min-height: 0;
    padding: 1.85rem 1.25rem 1.35rem;
    width: min(430px, calc(100% - 1.25rem));
  }

  .modal-title {
    font-size: 1.35rem;
  }

  .modal-sub {
    font-size: 1rem;
    margin-bottom: 1.3rem;
  }

  .viewer-modal {
    padding: 3.15rem 1.25rem 1.35rem;
  }

  .modal-close {
    top: 0.7rem;
    right: 0.7rem;
    width: 34px;
    height: 34px;
    font-size: 1.75rem;
  }

  .board {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 1.7rem;
    min-height: 360px !important;
    padding-top: 1.5rem;
  }

  .polaroid-wrap {
    width: 156px;
  }

  .polaroid {
    width: 156px;
    padding-bottom: 38px;
  }

  .polaroid-img {
    width: 136px;
    height: 124px;
  }

  .polaroid-wrap:hover,
  .polaroid-wrap:focus-within {
    transform: rotate(0deg) scale(1.04);
  }

  .polaroid-wrap.dragging {
    transform: rotate(0deg) scale(1.02);
  }

  .delete-btn {
    opacity: 1;
    pointer-events: auto;
  }

  .made-by {
    right: 1rem;
    bottom: 1rem;
    font-size: 0.72rem;
  }
}
</style>
</head>
<body class="is-loading">
<a href="#main-content" class="skip-link">Skip to main content</a>
<div class="sr-only" aria-live="polite" aria-atomic="true" id="sr-status"></div>
<div class="scene" aria-hidden="true"></div>

<div class="loading-overlay" id="loading" role="status" aria-label="Loading memories">
  <p class="loading-title">loading memories</p>
  <div class="loading-dots" aria-hidden="true"><span></span><span></span><span></span></div>
</div>

<main class="page" id="main-content">
  <header class="header">
    <h1 class="header-title">hang your favorite photos</h1>
    <p class="header-sub">A quiet place to keep the moments, faces, and small details you want to remember.</p>
  </header>

  <form class="quick-add" id="quick-add" aria-label="Add a memory">
    <label class="sr-only" for="memory-name">Your name</label>
    <input class="quick-input" id="memory-name" type="text" maxlength="30" autocomplete="given-name" placeholder="Your name">
    <label class="sr-only" for="memory-caption">Why is this special?</label>
    <input class="quick-input" id="memory-caption" type="text" maxlength="120" placeholder="Why is this special?">
    <input class="sr-only" id="memory-photo" type="file" accept="image/*">
    <button class="quick-add-btn" id="quick-add-btn" type="submit">+ Add Memory</button>
  </form>

  <section aria-label="Favorite photo board">
    <div class="board" id="board"></div>
  </section>
</main>

<a class="made-by" href="https://vibe-coding.vercel.app/" target="_blank" rel="noopener noreferrer">Made by Mars</a>

<div class="viewer-backdrop" id="viewer-backdrop" aria-hidden="true">
  <div class="modal viewer-modal" role="dialog" aria-modal="true" aria-labelledby="viewer-title">
    <button class="modal-close" id="viewer-close" type="button" aria-label="Close">&times;</button>
    <div class="viewer-photo" id="viewer-photo"></div>
    <h2 class="modal-title" id="viewer-title"></h2>
    <p class="viewer-caption" id="viewer-caption"></p>
    <p class="viewer-author" id="viewer-author"></p>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
const STORAGE_KEY = "favorite_photo_memories_v1";
const LAYOUT_STORAGE_KEY = "favorite_photo_layout_v1";
const LEGACY_STORAGE_KEYS = ["archiving_memories_v1"];
const ROTS = [-9, -6, -4, -2, 2, 4, 6, 8, -7, 5];
const CARD_WIDTH = 184;
const MOBILE_CARD_WIDTH = 156;

let memories = [];
let layoutPositions = {};
let draftPhoto = null;
let toastTimer = null;
let dragState = null;

const board = document.getElementById("board");
const viewer = document.getElementById("viewer-backdrop");
const viewerPhoto = document.getElementById("viewer-photo");
const viewerTitle = document.getElementById("viewer-title");
const viewerCaption = document.getElementById("viewer-caption");
const viewerAuthor = document.getElementById("viewer-author");
const quickAddForm = document.getElementById("quick-add");
const nameInput = document.getElementById("memory-name");
const photoInput = document.getElementById("memory-photo");
const captionInput = document.getElementById("memory-caption");
const viewerCloseBtn = document.getElementById("viewer-close");

window.addEventListener("load", () => {
  loadMemories();
  renderMemories();
  setTimeout(() => {
    document.body.classList.remove("is-loading");
    document.getElementById("loading").classList.add("hidden");
  }, 3000);
});

window.addEventListener("resize", debounce(() => {
  renderMemories();
}, 160));

quickAddForm.addEventListener("submit", prepareMemory);
viewerCloseBtn.addEventListener("click", closeViewer);
photoInput.addEventListener("change", handlePhoto);

viewer.addEventListener("click", event => {
  if (event.target === viewer) closeViewer();
});

document.addEventListener("keydown", event => {
  if (viewer.classList.contains("open") && event.key === "Escape") {
    closeViewer();
    return;
  }
});

function loadMemories() {
  try {
    const current = localStorage.getItem(STORAGE_KEY);
    if (current) {
      memories = JSON.parse(current);
    } else {
      for (const key of LEGACY_STORAGE_KEYS) {
        const legacy = localStorage.getItem(key);
        if (legacy) {
          memories = JSON.parse(legacy);
          saveMemories();
          break;
        }
      }
    }
    if (!Array.isArray(memories)) memories = [];
  } catch (error) {
    memories = [];
    showToast("Could not read saved memories.");
  }

  try {
    layoutPositions = JSON.parse(localStorage.getItem(LAYOUT_STORAGE_KEY) || "{}");
  } catch (error) {
    layoutPositions = {};
  }
}

function saveMemories() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(memories));
}

function saveLayout() {
  localStorage.setItem(LAYOUT_STORAGE_KEY, JSON.stringify(layoutPositions));
}

function openViewer(memory) {
  viewerPhoto.classList.toggle("is-empty", !memory.photo);
  viewerPhoto.innerHTML = memory.photo
    ? `<img src="${memory.photo}" alt="Photo by ${escapeHtml(memory.name)}">`
    : '<span role="img" aria-label="leaf">🌿</span>';
  viewerTitle.textContent = "A favorite photo";
  viewerCaption.textContent = memory.caption;
  viewerAuthor.textContent = `by ${memory.name}`;
  viewer.classList.add("open");
  viewer.setAttribute("aria-hidden", "false");
  setTimeout(() => viewerCloseBtn.focus(), 80);
}

function closeViewer() {
  viewer.classList.remove("open");
  viewer.setAttribute("aria-hidden", "true");
}

function prepareMemory(event) {
  event.preventDefault();
  draftPhoto = null;
  photoInput.value = "";
  photoInput.click();
}

function submitMemory() {
  const name = nameInput.value.trim() || "guest";
  const caption = captionInput.value.trim() || "favorite moment";

  memories.push({
    id: String(Date.now()) + Math.random().toString(16).slice(2),
    name,
    caption,
    photo: draftPhoto,
    ts: Date.now()
  });

  saveMemories();
  renderMemories();
  nameInput.value = "";
  captionInput.value = "";
  photoInput.value = "";
  draftPhoto = null;
  announce("Photo hung.");
  showToast("Photo hung.");
}

function handlePhoto() {
  const file = photoInput.files && photoInput.files[0];
  if (!file) return;
  showToast("Compressing photo...");
  compressPhoto(file, dataUrl => {
    draftPhoto = dataUrl;
    submitMemory();
  });
}

function compressPhoto(file, callback) {
  const reader = new FileReader();
  reader.onload = event => {
    const img = new Image();
    img.onload = () => {
      const max = 900;
      let width = img.width;
      let height = img.height;
      if (width > max) {
        height = Math.round(height * max / width);
        width = max;
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext("2d");
      context.drawImage(img, 0, 0, width, height);
      callback(canvas.toDataURL("image/jpeg", 0.74));
    };
    img.onerror = () => showToast("Could not read that photo.");
    img.src = event.target.result;
  };
  reader.onerror = () => showToast("Could not read that file.");
  reader.readAsDataURL(file);
}

function renderMemories() {
  board.querySelectorAll(".polaroid-wrap").forEach(item => item.remove());

  if (!memories.length) {
    board.style.minHeight = "460px";
    return;
  }

  const count = memories.length;
  pruneLayout();

  const cols = getColumnCount(count);
  setBoardHeight(cols);

  memories.forEach((memory, index) => {
    const position = clampPosition(layoutPositions[memory.id] || getDefaultPosition(memory, index, cols));
    const rot = ROTS[index % ROTS.length];

    const wrap = document.createElement("article");
    wrap.className = "polaroid-wrap";
    wrap.tabIndex = 0;
    wrap.dataset.id = memory.id;
    wrap.setAttribute("aria-label", `${memory.name}: ${memory.caption}`);
    wrap.style.cssText = `left:${position.x}%;top:${position.y}px;--rot:${rot}deg;z-index:${10 + index};animation-delay:${index * 0.04}s;`;

    wrap.innerHTML = `
      <div class="polaroid">
        <button class="delete-btn" type="button" aria-label="Delete memory by ${escapeHtml(memory.name)}">&times;</button>
        <div class="polaroid-img">
          ${memory.photo
            ? `<img src="${memory.photo}" alt="Photo by ${escapeHtml(memory.name)}">`
            : '<span role="img" aria-label="leaf">🌿</span>'}
        </div>
        <p class="polaroid-caption">${escapeHtml(memory.caption)}</p>
        <p class="polaroid-author">by ${escapeHtml(memory.name)}</p>
      </div>
    `;

    wrap.querySelector(".delete-btn").addEventListener("click", event => {
      event.stopPropagation();
      deleteMemory(memory.id, wrap);
    });
    wrap.addEventListener("pointerdown", startDrag);

    board.appendChild(wrap);
  });
}

function deleteMemory(id, element) {
  const memory = memories.find(item => item.id === id);
  const savedName = memory && memory.name && memory.name !== "guest" ? memory.name : "";
  const prompt = savedName ? `Delete ${savedName}'s memory? This cannot be undone.` : "Delete this memory? This cannot be undone.";
  const confirmed = window.confirm(prompt);

  if (!confirmed) {
    showToast("Memory kept.");
    return;
  }

  element.classList.add("deleting");
  setTimeout(() => {
    memories = memories.filter(memory => memory.id !== id);
    delete layoutPositions[id];
    saveMemories();
    saveLayout();
    renderMemories();
    announce("Memory deleted.");
    showToast("Memory deleted.");
  }, 220);
}

function getDefaultPosition(memory, index, cols) {
  const random = seededRand(hashString(memory.id));
  const colWidth = 100 / cols;
  return {
    x: Math.min((index % cols) * colWidth + random() * colWidth * 0.48 + colWidth * 0.08, getMaxXPercent()),
    y: Math.floor(index / cols) * 235 + 85 + random() * 58
  };
}

function setBoardHeight(cols) {
  const baseHeight = Math.ceil(memories.length / cols) * 245 + 130;
  const maxSavedY = Object.values(layoutPositions).reduce((max, position) => {
    return Math.max(max, Number(position.y) || 0);
  }, 0);
  board.style.minHeight = `${Math.max(baseHeight, maxSavedY + 260)}px`;
}

function pruneLayout() {
  const ids = new Set(memories.map(memory => memory.id));
  let changed = false;
  Object.keys(layoutPositions).forEach(id => {
    if (!ids.has(id)) {
      delete layoutPositions[id];
      changed = true;
    }
  });
  if (changed) saveLayout();
}

function startDrag(event) {
  if (event.target.closest(".delete-btn")) return;
  const card = event.currentTarget;
  const boardRect = board.getBoundingClientRect();
  const cardRect = card.getBoundingClientRect();
  dragState = {
    id: card.dataset.id,
    memory: memories.find(memory => memory.id === card.dataset.id),
    card,
    boardRect,
    startX: event.clientX,
    startY: event.clientY,
    moved: false,
    offsetX: event.clientX - cardRect.left,
    offsetY: event.clientY - cardRect.top
  };
  card.classList.add("dragging");
  card.setPointerCapture(event.pointerId);
  card.addEventListener("pointermove", moveDrag);
  card.addEventListener("pointerup", endDrag);
  card.addEventListener("pointercancel", endDrag);
}

function moveDrag(event) {
  if (!dragState) return;
  if (Math.abs(event.clientX - dragState.startX) > 5 || Math.abs(event.clientY - dragState.startY) > 5) {
    dragState.moved = true;
  }
  const card = dragState.card;
  const cardWidth = card.offsetWidth;
  const cardHeight = card.offsetHeight;
  const boardWidth = dragState.boardRect.width;
  const maxLeft = Math.max(0, boardWidth - cardWidth);
  const maxTop = Math.max(0, board.offsetHeight - cardHeight);
  const leftPx = clamp(event.clientX - dragState.boardRect.left - dragState.offsetX, 0, maxLeft);
  const topPx = clamp(event.clientY - dragState.boardRect.top - dragState.offsetY, 0, maxTop);
  const leftPercent = boardWidth ? (leftPx / boardWidth) * 100 : 0;

  card.style.left = `${leftPercent}%`;
  card.style.top = `${topPx}px`;
}

function endDrag(event) {
  if (!dragState) return;
  const card = dragState.card;
  const didMove = dragState.moved;
  const memory = dragState.memory;
  const leftPercent = parseFloat(card.style.left) || 0;
  const topPx = parseFloat(card.style.top) || 0;
  if (didMove) {
    layoutPositions[dragState.id] = {
      x: Number(leftPercent.toFixed(2)),
      y: Math.round(topPx)
    };
    saveLayout();
  }
  card.classList.remove("dragging");
  card.removeEventListener("pointermove", moveDrag);
  card.removeEventListener("pointerup", endDrag);
  card.removeEventListener("pointercancel", endDrag);
  dragState = null;
  setBoardHeight(getColumnCount(memories.length));
  if (!didMove && memory) openViewer(memory);
}

function getColumnCount(count) {
  if (window.matchMedia("(max-width: 680px)").matches) return Math.min(2, Math.max(1, count));
  return Math.max(3, Math.min(6, Math.ceil(Math.sqrt(count + 2))));
}

function getCardWidth() {
  return window.matchMedia("(max-width: 680px)").matches ? MOBILE_CARD_WIDTH : CARD_WIDTH;
}

function getMaxXPercent() {
  const boardWidth = board.clientWidth || window.innerWidth || 1;
  return Math.max(0, ((boardWidth - getCardWidth()) / boardWidth) * 100);
}

function clampPosition(position) {
  return {
    x: clamp(Number(position.x) || 0, 0, getMaxXPercent()),
    y: Math.max(0, Number(position.y) || 0)
  };
}

function showToast(message) {
  const toast = document.getElementById("toast");
  clearTimeout(toastTimer);
  toast.textContent = message;
  toast.classList.add("show");
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
}

function announce(message) {
  const status = document.getElementById("sr-status");
  status.textContent = "";
  setTimeout(() => { status.textContent = message; }, 40);
}

function escapeHtml(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function debounce(callback, delay) {
  let timer = null;
  return function() {
    clearTimeout(timer);
    timer = setTimeout(callback, delay);
  };
}

function seededRand(seed) {
  let state = seed || 1;
  return function() {
    state = (state * 9301 + 49297) % 233280;
    return state / 233280;
  };
}

function hashString(value) {
  let hash = 0;
  for (let i = 0; i < value.length; i += 1) {
    hash = ((hash << 5) - hash) + value.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}
